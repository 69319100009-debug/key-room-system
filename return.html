<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คืนกุญแจ | Key Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #17213a; }

        /* SIDEBAR & NAV */
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #17295d, #285edc); color: white; padding: 20px 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,.2); }
        .logo-icon { font-size: 25px; }
        .logo h1 { font-size: 18px; }
        .logo p { font-size: 10px; color: #cbd6f2; }
        .menu-title { font-size: 11px; color: #b8c7ed; padding: 0 12px 10px; }
        .menu a { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 12px; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; }
        .menu a:hover, .menu a.active { background: rgba(255,255,255,.16); }
        .admin-profile { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .admin-avatar { width: 35px; height: 35px; background: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* MAIN */
        .main { margin-left: 220px; min-height: 100vh; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e5e9f0; display: flex; align-items: center; justify-content: space-between; padding: 0 35px; }
        .header h2 { font-size: 18px; }
        .date { background: #eef5ff; color: #2861d7; padding: 6px 12px; border-radius: 8px; font-size: 11px; }

        /* CONTENT */
        .content { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .form-card { background: white; border-radius: 16px; padding: 35px; border: 1px solid #e2e8f1; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .title-sec { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .title-icon { width: 50px; height: 50px; background: #e0e7ff; color: #4338ca; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #285edc; }
        textarea { height: 90px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button, .btn-cancel { border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        button { background: #285edc; color: white; }
        button:hover { background: #1d4ed8; }
        .btn-cancel { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div>
        <div class="logo">
            <div class="logo-icon">🔑</div>
            <div>
                <h1>Key Room</h1>
                <p>ระบบยืม-คืนกุญแจ</p>
            </div>
        </div>
        <div class="menu-title">เมนูหลัก</div>
        <nav class="menu">
            <a href="index.html"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="rooms.html"><span>🏫</span><span>ห้องเรียน</span></a>
            <a href="borrow.html"><span>🔑</span><span>ยืมกุญแจ</span></a>
            <a href="return.html" class="active"><span>↩️</span><span>คืนกุญแจ</span></a>
            <a href="history.html"><span>📋</span><span>ประวัติ</span></a>
        </nav>
    </div>
    <div class="admin-profile">
        <div class="admin-avatar">A</div>
        <div>
            <div style="font-size:12px; font-weight:bold;">ผู้ดูแลระบบ</div>
            <div style="font-size:10px; color:#cbd6f2;">Administrator</div>
        </div>
    </div>
</aside>

<main class="main">
    <header class="header">
        <div>
            <div style="font-size: 11px; color: #94a3b8;">หน้าหลัก / คืนกุญแจ</div>
            <h2>คืนกุญแจ</h2>
        </div>
        <div class="date">📅 24 สิงหาคม 2569</div>
    </header>

    <section class="content">
        <div class="form-card">
            <div class="title-sec">
                <div class="title-icon">↩️</div>
                <div>
                    <h2>บันทึกการคืนกุญแจ</h2>
                    <p style="font-size:12px; color:#64748b;">กรอกข้อมูลสำหรับการคืนกุญแจห้องเรียน</p>
                </div>
            </div>

            <!-- ฟอร์มคืนกุญแจ -->
            <form id="returnForm">
                <div class="form-group">
                    <label>ชื่อผู้คืน</label>
                    <input type="text" id="returner" placeholder="กรอกชื่อผู้คืน" required>
                </div>

                <div class="form-group">
                    <label>ห้องเรียน (แสดงเฉพาะห้องที่ยืมอยู่)</label>
                    <select id="room" required>
                        <option value="">-- เลือกห้องเรียน --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>สภาพกุญแจ</label>
                    <select id="condition" required>
                        <option value="">-- เลือกสภาพกุญแจ --</option>
                        <option value="ปกติ">ปกติ</option>
                        <option value="ชำรุด">ชำรุด</option>
                        <option value="สูญหาย">สูญหาย</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>หมายเหตุ</label>
                    <textarea id="note" placeholder="กรอกหมายเหตุเพิ่มเติม (ถ้ามี)"></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit">↩️ ยืนยันการคืน</button>
                    <a href="rooms.html" class="btn-cancel">ยกเลิก</a>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
// ฟังก์ชันสกัดตัวเลขห้อง (ป้องกันปัญหาสะกดไม่ตรงกัน)
function getRoomNum(str) {
    return str ? str.replace(/[^0-9]/g, '') : '';
}

function getHistory() {
    try {
        return JSON.parse(localStorage.getItem("keyHistory")) || [];
    } catch(e) { return []; }
}

// ดึงเฉพาะห้องที่กำลังถูกยืมอยู่มาใส่ Select Dropdown
function loadBorrowedRooms() {
    const history = getHistory();
    const roomSelect = document.getElementById("room");
    
    // รายชื่อห้องทั้งหมดในระบบ
    const allRooms = ["ห้อง 121", "ห้อง 122", "ห้อง 124", "ห้อง 125", "ห้อง 141", "ห้อง 142", "ห้อง 145"];
    
    roomSelect.innerHTML = '<option value="">-- เลือกห้องเรียน --</option>';
    let count = 0;

    allRooms.forEach(roomName => {
        const roomNum = getRoomNum(roomName);
        // หาประวัติล่าสุดของห้องนี้
        const lastRecord = history.slice().reverse().find(item => getRoomNum(item.room) === roomNum);
        
        // ถ้าสถานะล่าสุดคือ "ยืม" ให้นำมาโชว์ให้กดคืนได้
        if (lastRecord && lastRecord.type === "ยืม") {
            const opt = document.createElement("option");
            opt.value = roomName;
            opt.textContent = `${roomName} (ผู้ยืม: ${lastRecord.name})`;
            roomSelect.appendChild(opt);
            count++;
        }
    });

    if (count === 0) {
        const opt = document.createElement("option");
        opt.disabled = true;
        opt.textContent = "--- ไม่มีห้องที่ถูกยืมอยู่ในขณะนี้ ---";
        roomSelect.appendChild(opt);
    }
}

// ทำงานทันทีเมื่อเปิดหน้า
loadBorrowedRooms();

// บันทึกการคืน
document.getElementById("returnForm").addEventListener("submit", function(e){
    e.preventDefault();

    const roomVal = document.getElementById("room").value;
    const returnerVal = document.getElementById("returner").value.trim();
    const conditionVal = document.getElementById("condition").value;
    const noteVal = document.getElementById("note").value.trim();

    if (!roomVal) {
        alert("กรุณาเลือกห้องเรียนที่ต้องการคืน");
        return;
    }

    let history = getHistory();

    // เพิ่ม Record การคืนเข้า localStorage
    history.push({
        id: Date.now(),
        type: "คืน",
        name: returnerVal,
        room: roomVal,
        condition: conditionVal,
        note: noteVal,
        date: new Date().toLocaleString("th-TH")
    });

    localStorage.setItem("keyHistory", JSON.stringify(history));
    alert("บันทึกการคืนกุญแจเรียบร้อยแล้ว!");
    window.location.href = "rooms.html";
});
</script>

</body>
</html>
