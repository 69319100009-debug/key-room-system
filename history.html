<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติ | Key Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #17213a; }
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #17295d, #285edc); color: white; padding: 20px 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,.2); }
        .logo-icon { font-size: 25px; }
        .logo h1 { font-size: 18px; }
        .logo p { font-size: 10px; color: #cbd6f2; }
        .menu-title { font-size: 11px; color: #b8c7ed; padding: 0 12px 10px; }
        .menu a { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 12px; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; }
        .menu a:hover, .menu a.active { background: rgba(255,255,255,.16); }
        .admin-profile { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .admin-avatar { width: 35px; height: 35px; background: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .main { margin-left: 220px; min-height: 100vh; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e5e9f0; display: flex; align-items: center; justify-content: space-between; padding: 0 35px; }
        .header h2 { font-size: 18px; }
        .date { background: #eef5ff; color: #2861d7; padding: 6px 12px; border-radius: 8px; font-size: 11px; }
        .content { padding: 30px 35px; }
        .card-box { background: white; border-radius: 14px; padding: 22px; border: 1px solid #e2e8f1; overflow-x: auto; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { color: #64748b; font-weight: bold; background: #f8fafc; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-ยืม { background: #fee2e2; color: #991b1b; }
        .badge-คืน { background: #dcfce7; color: #166534; }
        .btn-clear { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }

        @media (max-width: 768px) {
            .sidebar { position: relative; width: 100%; height: auto; padding: 15px; }
            .logo { margin-bottom: 10px; }
            .menu { display: flex; flex-wrap: wrap; gap: 5px; }
            .menu a { flex: 1 1 calc(50% - 5px); height: 40px; font-size: 12px; justify-content: center; }
            .admin-profile { display: none; }
            .main { margin-left: 0; }
            .header { padding: 0 15px; }
            .content { padding: 15px; }
        }
    </style>
</head>
<body>
<aside class="sidebar">
    <div>
        <div class="logo"><div class="logo-icon">🔑</div><div><h1>Key Room</h1><p>ระบบยืม-คืนกุญแจ</p></div></div>
        <div class="menu-title">เมนูหลัก</div>
        <nav class="menu">
            <a href="index.html"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="rooms.html"><span>🏫</span><span>ห้องเรียน</span></a>
            <a href="borrow.html"><span>🔑</span><span>ยืมกุญแจ</span></a>
            <a href="return.html"><span>↩️</span><span>คืนกุญแจ</span></a>
            <a href="history.html" class="active"><span>📋</span><span>ประวัติ</span></a>
        </nav>
    </div>
    <div class="admin-profile"><div class="admin-avatar">A</div><div><div style="font-size:12px; font-weight:bold;">ผู้ดูแลระบบ</div><div style="font-size:10px; color:#cbd6f2;">Administrator</div></div></div>
</aside>
<main class="main">
    <header class="header">
        <div><div style="font-size: 11px; color: #94a3b8;">หน้าหลัก / ประวัติ</div><h2>ประวัติการยืม-คืนกุญแจ</h2></div>
        <div class="date">📅 บันทึกข้อมูล</div>
    </header>
    <section class="content">
        <div class="card-box">
            <div class="card-header">
                <h3>รายการยืม-คืนทั้งหมด</h3>
                <button class="btn-clear" onclick="clearHistory()">🗑️ ล้างประวัติทั้งหมด</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>วัน-เวลา</th>
                        <th>ประเภท</th>
                        <th>ผู้ทำรายการ</th>
                        <th>ห้องเรียน</th>
                        <th>รายละเอียด / สภาพ</th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
    </section>
</main>
<script>
function renderHistory() {
    const history = JSON.parse(localStorage.getItem("keyHistory")) || [];
    const tbody = document.getElementById("historyTable");
    tbody.innerHTML = "";
    if (history.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 25px; color:#94a3b8;">ยังไม่มีประวัติการยืม-คืนกุญแจ</td></tr>';
        return;
    }
    history.slice().reverse().forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.date || '-'}</td>
            <td><span class="badge badge-${item.type}">${item.type}</span></td>
            <td><strong>${item.name}</strong></td>
            <td>${item.room}</td>
            <td style="color:#64748b;">${item.purpose || '-'}</td>
        `;
        tbody.appendChild(tr);
    });
}
function clearHistory() {
    if(confirm("คุณแน่ใจหรือไม่ว่าต้องการล้างประวัติการยืม-คืนทั้งหมด?")) {
        localStorage.removeItem("keyHistory");
        renderHistory();
    }
}
renderHistory();
</script>
</body>
</html>
