<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการยืม-คืน | Key Room System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="breadcrumb">หน้าหลัก / ประวัติ</div>
    <h1 class="page-title">บันทึกการยืม-คืน (Borrow Logs)</h1>

    <div class="card">
      <div class="btn-wrapper">
        <button id="clearBtn" class="btn-clear">ล้างข้อมูลประวัติ</button>
      </div>

      <!-- ครอบด้วย table-responsive เพื่อให้สโครลในมือถือได้ -->
      <div class="table-responsive">
        <table id="historyTable">
          <thead>
            <tr>
              <th>ผู้ยืม (ID / ชื่อ)</th>
              <th>วันเวลาที่ยืม</th>
              <th>วันเวลาที่คืน</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="historyList">
            <!-- ข้อมูลจาก JavaScript จะถูกดึงมาใส่ตรงนี้ -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
