<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก | Key Room System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #17213a; }
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #17295d, #285edc); color: white; padding: 20px 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,.2); }
        .logo-icon { font-size: 25px; }
        .logo h1 { font-size: 18px; }
        .logo p { font-size: 10px; color: #cbd6f2; }
        .menu-title { font-size: 11px; color: #b8c7ed; padding: 0 12px 10px; }
        .menu a { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 12px; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; }
        .menu a:hover, .menu a.active { background: rgba(255,255,255,.16); }
        .admin-profile { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; }
        .admin-avatar { width: 35px; height: 35px; background: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .main { margin-left: 220px; min-height: 100vh; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e5e9f0; display: flex; align-items: center; justify-content: space-between; padding: 0 35px; }
        .content { padding: 30px 35px; display: flex; flex-direction: column; gap: 25px; }
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 14px; padding: 20px; border: 1px solid #e2e8f1; }
        .card h3 { font-size: 28px; color: #2563eb; margin-top: 10px; }
        .card p { font-size: 12px; color: #64748b; }

        @media (max-width: 768px) {
            .sidebar { position: relative; width: 100%; height: auto; padding: 15px; }
            .menu { display: flex; flex-wrap: wrap; gap: 5px; }
            .menu a { flex: 1 1 calc(50% - 5px); height: 40px; font-size: 12px; justify-content: center; }
            .admin-profile { display: none; }
            .main { margin-left: 0; }
            .header { padding: 0 15px; }
            .content { padding: 15px; }
        }
    </style>
</head>
<body>
<aside class="sidebar">
    <div>
        <div class="logo"><div class="logo-icon">🔑</div><div><h1>Key Room</h1><p>ระบบจัดการกุญแจ</p></div></div>
        <div class="menu-title">เมนูหลัก</div>
        <nav class="menu">
            <a href="index.html" class="active"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="rooms.html"><span>🏫</span><span>กุญแจ/ห้องเรียน</span></a>
            <a href="borrow.html"><span>🔑</span><span>ยืมกุญแจ</span></a>
            <a href="return.html"><span>↩️</span><span>คืนกุญแจ</span></a>
            <a href="history.html"><span>📋</span><span>ประวัติ</span></a>
        </nav>
    </div>
    <div class="admin-profile"><div class="admin-avatar">A</div><div><div style="font-size:12px; font-weight:bold;">ผู้ดูแลระบบ</div><div style="font-size:10px; color:#cbd6f2;">Administrator</div></div></div>
</aside>
<main class="main">
    <header class="header">
        <div><div style="font-size: 11px; color: #94a3b8;">หน้าหลัก</div><h2>แดชบอร์ดสรุปสถานะ</h2></div>
    </header>
    <section class="content">
        <div class="grid-stats">
            <div class="card"><p>ห้องทั้งหมด</p><h3 id="totalRooms">7</h3></div>
            <div class="card"><p>กุญแจว่าง (พร้อมยืม)</p><h3 id="availableRooms" style="color:#16a34a;">0</h3></div>
            <div class="card"><p>กุญแจถูกยืมอยู่</p><h3 id="borrowedRooms" style="color:#dc2626;">0</h3></div>
        </div>
    </section>
</main>
<script>
const roomsData = [
    { keyId: "K121", roomId: "R121", roomName: "ห้อง 121", building: "อาคาร 1", floor: "ชั้น 1", computers: 30, keyStatus: "ว่าง" },
    { keyId: "K122", roomId: "R122", roomName: "ห้อง 122", building: "อาคาร 1", floor: "ชั้น 1", computers: 30, keyStatus: "ว่าง" },
    { keyId: "K124", roomId: "R124", roomName: "ห้อง 124", building: "อาคาร 1", floor: "ชั้น 1", computers: 35, keyStatus: "ว่าง" },
    { keyId: "K125", roomId: "R125", roomName: "ห้อง 125", building: "อาคาร 1", floor: "ชั้น 1", computers: 35, keyStatus: "ว่าง" },
    { keyId: "K141", roomId: "R141", roomName: "ห้อง 141", building: "อาคาร 1", floor: "ชั้น 2", computers: 40, keyStatus: "ว่าง" },
    { keyId: "K142", roomId: "R142", roomName: "ห้อง 142", building: "อาคาร 1", floor: "ชั้น 2", computers: 40, keyStatus: "ว่าง" },
    { keyId: "K145", roomId: "R145", roomName: "ห้อง 145", building: "อาคาร 1", floor: "ชั้น 2", computers: 30, keyStatus: "ว่าง" }
];

function updateDashboard() {
    const history = JSON.parse(localStorage.getItem("borrowLogs")) || [];
    let borrowedCount = 0;
    roomsData.forEach(r => {
        const lastRecord = history.slice().reverse().find(item => item.keyId === r.keyId);
        if (lastRecord && lastRecord.status === "ยืมอยู่") {
            borrowedCount++;
        }
    });
    document.getElementById("totalRooms").innerText = roomsData.length;
    document.getElementById("borrowedRooms").innerText = borrowedCount;
    document.getElementById("availableRooms").innerText = roomsData.length - borrowedCount;
}
updateDashboard();
</script>
</body>
</html>
