<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการยืม-คืน | Key Room System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Breadcrumb & Header -->
    <div class="breadcrumb">หน้าหลัก / ประวัติ</div>
    <h1 class="page-title">บันทึกการยืม-คืน (Borrow Logs)</h1>

    <!-- Card Wrapper -->
    <div class="main-card">
      
      <!-- Action Button -->
      <div class="action-bar">
        <button class="btn-delete">ล้างข้อมูลประวัติ</button>
      </div>

      <!-- Log Items Container (Responsive View) -->
      <div class="log-list">
        
        <!-- Record Item 1 -->
        <div class="log-item">
          <div class="user-info">
            <div class="user-name">ณัฐชนก พุ่มอุทสาห์</div>
            <div class="user-id">(69319100009)</div>
          </div>
          
          <div class="time-info">
            <div class="time-row">
              <span class="label">ยืม:</span> 
              <span class="value">24/8/2569 23:37</span>
            </div>
            <div class="time-row">
              <span class="label">คืน:</span> 
              <span class="value">24/8/2569 23:38</span>
            </div>
          </div>

          <div class="status-wrap">
            <span class="status-badge status-returned">คืนแล้ว</span>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
