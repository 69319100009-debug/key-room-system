<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องเรียน | Key Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #17213a; }
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #17295d, #285edc); color: white; padding: 20px 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,.2); }
        .logo-icon { font-size: 25px; }
        .logo h1 { font-size: 18px; }
        .logo p { font-size: 10px; color: #cbd6f2; }
        .menu-title { font-size: 11px; color: #b8c7ed; padding: 0 12px 10px; }
        .menu a { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 12px; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; }
        .menu a:hover, .menu a.active { background: rgba(255,255,255,.16); }
        .admin-profile { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .admin-avatar { width: 35px; height: 35px; background: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .main { margin-left: 220px; min-height: 100vh; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e5e9f0; display: flex; align-items: center; justify-content: space-between; padding: 0 35px; }
        .header h2 { font-size: 18px; }
        .date { background: #eef5ff; color: #2861d7; padding: 6px 12px; border-radius: 8px; font-size: 11px; }
        .content { padding: 30px 35px; display: flex; flex-direction: column; gap: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .room-card { background: white; border-radius: 14px; padding: 20px; border: 1px solid #e2e8f1; position: relative; }
        .room-num { font-size: 32px; font-weight: bold; color: #2563eb; }
        .badge { position: absolute; top: 20px; right: 20px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status-ready { background: #dcfce7; color: #166534; }
        .status-borrowed { background: #fee2e2; color: #991b1b; }

        @media (max-width: 768px) {
            .sidebar { position: relative; width: 100%; height: auto; padding: 15px; }
            .logo { margin-bottom: 10px; }
            .menu { display: flex; flex-wrap: wrap; gap: 5px; }
            .menu a { flex: 1 1 calc(50% - 5px); height: 40px; font-size: 12px; justify-content: center; }
            .admin-profile { display: none; }
            .main { margin-left: 0; }
            .header { padding: 0 15px; }
            .content { padding: 15px; }
        }
    </style>
</head>
<body>
<aside class="sidebar">
    <div>
        <div class="logo"><div class="logo-icon">🔑</div><div><h1>Key Room</h1><p>ระบบยืม-คืนกุญแจ</p></div></div>
        <div class="menu-title">เมนูหลัก</div>
        <nav class="menu">
            <a href="index.html"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="rooms.html" class="active"><span>🏫</span><span>ห้องเรียน</span></a>
            <a href="borrow.html"><span>🔑</span><span>ยืมกุญแจ</span></a>
            <a href="return.html"><span>↩️</span><span>คืนกุญแจ</span></a>
            <a href="history.html"><span>📋</span><span>ประวัติ</span></a>
        </nav>
    </div>
    <div class="admin-profile"><div class="admin-avatar">A</div><div><div style="font-size:12px; font-weight:bold;">ผู้ดูแลระบบ</div><div style="font-size:10px; color:#cbd6f2;">Administrator</div></div></div>
</aside>
<main class="main">
    <header class="header">
        <div><div style="font-size: 11px; color: #94a3b8;">หน้าหลัก / ห้องเรียน</div><h2>รายการห้องเรียนทั้งหมด</h2></div>
        <div class="date">📅 ระบบจัดการกุญแจ</div>
    </header>
    <section class="content">
        <h3>ตรวจสอบสถานะห้องเรียนและกุญแจ</h3>
        <div class="grid" id="roomsList"></div>
    </section>
</main>
<script>
const roomsData = [
    { name: "ห้อง 121", key: "K121", floor: "ชั้น 1" },
    { name: "ห้อง 122", key: "K122", floor: "ชั้น 1" },
    { name: "ห้อง 124", key: "K124", floor: "ชั้น 1" },
    { name: "ห้อง 125", key: "K125", floor: "ชั้น 1" },
    { name: "ห้อง 141", key: "K141", floor: "ชั้น 2" },
    { name: "ห้อง 142", key: "K142", floor: "ชั้น 2" },
    { name: "ห้อง 145", key: "K145", floor: "ชั้น 2" }
];
function render() {
    const history = JSON.parse(localStorage.getItem("keyHistory")) || [];
    const container = document.getElementById("roomsList");
    container.innerHTML = "";
    roomsData.forEach(r => {
        const roomNumOnly = r.name.replace(/[^0-9]/g, '');
        const lastRecord = history.slice().reverse().find(item => item.room && item.room.replace(/[^0-9]/g, '') === roomNumOnly);
        const isBorrowed = lastRecord && lastRecord.type === "ยืม";
        const div = document.createElement("div");
        div.className = "room-card";
        div.innerHTML = `
            <span class="badge ${isBorrowed ? 'status-borrowed':'status-ready'}">${isBorrowed ? '🔴 ถูกยืมอยู่':'🟢 พร้อมใช้งาน'}</span>
            <div class="room-num">${roomNumOnly}</div>
            <h4 style="margin-top:10px;">${r.name}</h4>
            <p style="font-size:12px; color:#64748b; margin-top:4px;">กุญแจ: ${r.key}</p>
            <p style="font-size:11px; color:#94a3b8; margin-top:15px; border-top:1px dashed #e2e8f1; padding-top:10px;">${r.floor}</p>
        `;
        container.appendChild(div);
    });
}
render();
</script>
</body>
</html>
