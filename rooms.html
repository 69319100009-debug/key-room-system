<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กุญแจและห้องเรียน | Key Room System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #17213a; }
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #17295d, #285edc); color: white; padding: 20px 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,.2); }
        .logo-icon { font-size: 25px; }
        .logo h1 { font-size: 18px; }
        .logo p { font-size: 10px; color: #cbd6f2; }
        .menu-title { font-size: 11px; color: #b8c7ed; padding: 0 12px 10px; }
        .menu a { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 12px; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; }
        .menu a:hover, .menu a.active { background: rgba(255,255,255,.16); }
        .main { margin-left: 220px; min-height: 100vh; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e5e9f0; display: flex; align-items: center; justify-content: space-between; padding: 0 35px; }
        .content { padding: 30px 35px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 14px; padding: 20px; border: 1px solid #e2e8f1; position: relative; }
        .badge { position: absolute; top: 20px; right: 20px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-ready { background: #dcfce7; color: #166534; }
        .badge-borrowed { background: #fee2e2; color: #991b1b; }
        .detail-item { font-size: 12px; color: #64748b; margin-top: 6px; }

        @media (max-width: 768px) {
            .sidebar { position: relative; width: 100%; height: auto; padding: 15px; }
            .menu { display: flex; flex-wrap: wrap; gap: 5px; }
            .menu a { flex: 1 1 calc(50% - 5px); height: 40px; font-size: 12px; justify-content: center; }
            .main { margin-left: 0; }
            .header { padding: 0 15px; }
            .content { padding: 15px; }
        }
    </style>
</head>
<body>
<aside class="sidebar">
    <div>
        <div class="logo"><div class="logo-icon">🔑</div><div><h1>Key Room</h1><p>ระบบจัดการกุญแจ</p></div></div>
        <div class="menu-title">เมนูหลัก</div>
        <nav class="menu">
            <a href="index.html"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="rooms.html" class="active"><span>🏫</span><span>กุญแจ/ห้องเรียน</span></a>
            <a href="borrow.html"><span>🔑</span><span>ยืมกุญแจ</span></a>
            <a href="return.html"><span>↩️</span><span>คืนกุญแจ</span></a>
            <a href="history.html"><span>📋</span><span>ประวัติ</span></a>
        </nav>
    </div>
</aside>
<main class="main">
    <header class="header">
        <div><div style="font-size: 11px; color: #94a3b8;">หน้าหลัก / กุญแจและห้องเรียน</div><h2>รายการห้องเรียนทั้งหมด</h2></div>
    </header>
    <section class="content">
        <div class="grid" id="roomsGrid"></div>
    </section>
</main>
<script>
const roomsData = [
    { keyId: "K121", roomId: "R121", roomName: "ห้อง 121", building: "อาคารเรียน 1", floor: "ชั้น 1", roomType: "ห้องปฏิบัติการคอมพิวเตอร์", computers: 30, manager: "อ.ผู้ดูแลระบบ" },
    { keyId: "K122", roomId: "R122", roomName: "ห้อง 122", building: "อาคารเรียน 1", floor: "ชั้น 1", roomType: "ห้องปฏิบัติการคอมพิวเตอร์", computers: 30, manager: "อ.ผู้ดูแลระบบ" },
    { keyId: "K124", roomId: "R124", roomName: "ห้อง 124", building: "อาคารเรียน 1", floor: "ชั้น 1", roomType: "ห้องปฏิบัติการคอมพิวเตอร์", computers: 35, manager: "อ.ผู้ดูแลระบบ" },
    { keyId: "K125", roomId: "R125", roomName: "ห้อง 125", building: "อาคารเรียน 1", floor: "ชั้น 1", roomType: "ห้องปฏิบัติการคอมพิวเตอร์", computers: 35, manager: "อ.ผู้ดูแลระบบ" },
    { keyId: "K141", roomId: "R141", roomName: "ห้อง 141", building: "อาคารเรียน 1", floor: "ชั้น 2", roomType: "ห้องปฏิบัติการคอมพิวเตอร์", computers: 40, manager: "อ.ผู้ดูแลระบบ" },
    { keyId: "K142", roomId: "R142", roomName: "ห้อง 142", building: "อาคารเรียน 1", floor: "ชั้น 2", roomType: "ห้องปฏิบัติการคอมพิวเตอร์", computers: 40, manager: "อ.ผู้ดูแลระบบ" },
    { keyId: "K145", roomId: "R145", roomName: "ห้อง 145", building: "อาคารเรียน 1", floor: "ชั้น 2", roomType: "ห้องบรรยาย", computers: 0, manager: "อ.ผู้ดูแลระบบ" }
];

function renderRooms() {
    const history = JSON.parse(localStorage.getItem("borrowLogs")) || [];
    const container = document.getElementById("roomsGrid");
    container.innerHTML = "";
    roomsData.forEach(r => {
        const lastRecord = history.slice().reverse().find(item => item.keyId === r.keyId);
        const isBorrowed = lastRecord && lastRecord.status === "ยืมอยู่";
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
            <span class="badge ${isBorrowed ? 'badge-borrowed':'badge-ready'}">${isBorrowed ? '🔴 ถูกยืม':'🟢 ว่าง'}</span>
            <h3 style="font-size: 22px; color: #2563eb;">${r.roomName}</h3>
            <div class="detail-item">🔑 รหัสกุญแจ: <b>${r.keyId}</b> | รหัสห้อง: ${r.roomId}</div>
            <div class="detail-item">🏢 ${r.building} (${r.floor})</div>
            <div class="detail-item">💻 คอมพิวเตอร์: ${r.computers} เครื่อง</div>
            <div class="detail-item" style="border-top: 1px dashed #e2e8f1; margin-top: 10px; padding-top: 8px; font-size: 11px;">👤 ผู้ดูแล: ${r.manager}</div>
        `;
        container.appendChild(div);
    });
}
renderRooms();
</script>
</body>
</html>
