<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการยืม-คืน | Key Room System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="breadcrumb">หน้าหลัก / ประวัติ</div>
    <h1 class="page-title">บันทึกการยืม-คืน (Borrow Logs)</h1>

    <div class="card">
      <div class="btn-wrapper">
        <button class="btn-clear" onclick="clearHistory()">ล้างข้อมูลประวัติ</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ผู้ยืม (ID / ชื่อ)</th>
              <th>ห้อง</th>
              <th>วันเวลาที่ยืม</th>
              <th>วันเวลาที่คืน</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="historyList">
            <!-- ข้อมูลจะขึ้นตรงนี้อัตโนมัติ -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function renderHistory() {
      const historyList = document.getElementById('historyList');
      
      let logs = JSON.parse(localStorage.getItem('borrowLogs')) || JSON.parse(localStorage.getItem('history')) || [];

      if (logs.length === 0) {
        historyList.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: #888;">ไม่มีข้อมูลประวัติ</td></tr>`;
        return;
      }

      historyList.innerHTML = logs.map(item => {
        const name = item.name || item.studentName || item.borrowerName || item.borrower || 'ไม่ระบุชื่อ';
        const id = item.id || item.studentId || item.code || item.borrowerId || '-';
        // ดักจับชื่อตัวแปรของห้อง
        const room = item.room || item.roomNumber || item.roomName || item.keyRoom || '-';
        const borrowTime = item.borrowTime || item.time || item.date || item.borrowDate || '-';
        const returnTime = item.returnTime || item.returnDate || '-';
        const status = item.status || (item.returnTime ? 'คืนแล้ว' : 'ยืมอยู่');

        return `
          <tr>
            <td>
              <div style="font-weight: bold; color: #1e293b;">${name}</div>
              <div style="font-size: 12px; color: #64748b;">(${id})</div>
            </td>
            <td>
              <span style="font-weight: 600; color: #2563eb;">${room}</span>
            </td>
            <td>${borrowTime}</td>
            <td>${returnTime}</td>
            <td>
              <span class="status-badge" style="background-color: ${status === 'คืนแล้ว' ? '#d1fae5' : '#fef3c7'}; color: ${status === 'คืนแล้ว' ? '#065f46' : '#92400e'};">
                ${status}
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function clearHistory() {
      if (confirm('คุณต้องการล้างข้อมูลประวัติทั้งหมดใช่หรือไม่?')) {
        localStorage.removeItem('borrowLogs');
        localStorage.removeItem('history');
        renderHistory();
      }
    }

    document.addEventListener('DOMContentLoaded', renderHistory);
  </script>
</body>
</html>
