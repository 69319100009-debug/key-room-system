<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติ | Key Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #17213a; }
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #17295d, #285edc); color: white; padding: 20px 10px; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,.2); }
        .logo h1 { font-size: 18px; }
        .logo p { font-size: 10px; color: #cbd6f2; }
        .menu-title { font-size: 11px; color: #b8c7ed; padding: 0 12px 10px; }
        .menu a { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 12px; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; }
        .menu a:hover, .menu a.active { background: rgba(255,255,255,.16); }
        .main { margin-left: 220px; min-height: 100vh; }
        .header { height: 110px; background: white; border-bottom: 1px solid #e5e9f0; display: flex; align-items: center; justify-content: space-between; padding: 0 35px; }
        .header h2 { font-size: 20px; }
        .content { padding: 35px; }
        .table-card { background: white; border-radius: 16px; padding: 25px; border: 1px solid #e2e8f1; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background: #f8fafc; color: #475569; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .type-ยืม { background: #fee2e2; color: #991b1b; }
        .type-คืน { background: #dcfce7; color: #166534; }
        .btn-clear { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .btn-clear:hover { background: #dc2626; }
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="logo"><div style="font-size:25px">🔑</div><div><h1>Key Room</h1><p>ระบบยืม-คืนกุญแจ</p></div></div>
    <div class="menu-title">เมนูหลัก</div>
    <nav class="menu">
        <a href="index.html"><span>🏠</span><span>หน้าหลัก</span></a>
        <a href="rooms.html"><span>🏫</span><span>ห้องเรียน</span></a>
        <a href="borrow.html"><span>🔑</span><span>ยืมกุญแจ</span></a>
        <a href="return.html"><span>↩️</span><span>คืนกุญแจ</span></a>
        <a href="history.html" class="active"><span>📋</span><span>ประวัติ</span></a>
    </nav>
</aside>
<main class="main">
    <header class="header">
        <h2>ประวัติการยืม-คืนกุญแจ</h2>
    </header>
    <section class="content">
        <div class="table-card">
            <div class="top-bar">
                <h3>รายการยืม-คืนทั้งหมด</h3>
                <button class="btn-clear" onclick="clearHistory()">🗑️ ล้างประวัติทั้งหมด</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>วัน-เวลา</th>
                        <th>ประเภท</th>
                        <th>ชื่อผู้ทำรายการ</th>
                        <th>ห้องเรียน</th>
                        <th>สภาพกุญแจ</th>
                        <th>หมายเหตุ</th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
    </section>
</main>
<script>
function loadHistory() {
    const history = JSON.parse(localStorage.getItem("keyHistory")) || [];
    const tbody = document.getElementById("historyTable");
    tbody.innerHTML = "";

    if (history.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">ไม่มีประวัติข้อมูล</td></tr>';
        return;
    }

    history.slice().reverse().forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.date || '-'}</td>
            <td><span class="badge type-${item.type}">${item.type}</span></td>
            <td>${item.name}</td>
            <td>${item.room}</td>
            <td>${item.condition}</td>
            <td>${item.note || '-'}</td>
        `;
        tbody.appendChild(tr);
    });
}

function clearHistory() {
    if (confirm("คุณต้องการล้างประวัติการยืม-คืนทั้งหมดใช่หรือไม่?")) {
        localStorage.removeItem("keyHistory");
        loadHistory();
    }
}

loadHistory();
</script>
</body>
</html>
