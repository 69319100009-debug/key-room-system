<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการยืม-คืน | Key Room System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #17213a; }
        .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #17295d, #285edc); color: white; padding: 20px 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,.2); }
        .logo-icon { font-size: 25px; }
        .logo h1 { font-size: 18px; }
        .logo p { font-size: 10px; color: #cbd6f2; }
        .menu-title { font-size: 11px; color: #b8c7ed; padding: 0 12px 10px; }
        .menu a { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 12px; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; }
        .menu a:hover, .menu a.active { background: rgba(255,255,255,.16); }
        .main { margin-left: 220px; min-height: 100vh; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e5e9f0; display: flex; align-items: center; justify-content: space-between; padding: 0 35px; }
        .content { padding: 30px 35px; }
        .card-box { background: white; border-radius: 14px; padding: 20px; border: 1px solid #e2e8f1; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #64748b; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-borrowing { background: #fee2e2; color: #991b1b; }
        .badge-returned { background: #dcfce7; color: #166534; }

        @media (max-width: 768px) {
            .sidebar { position: relative; width: 100%; height: auto; padding: 15px; }
            .menu { display: flex; flex-wrap: wrap; gap: 5px; }
            .menu a { flex: 1 1 calc(50% - 5px); height: 40px; font-size: 12px; justify-content: center; }
            .main { margin-left: 0; }
            .header { padding: 0 15px; }
            .content { padding: 15px; }
        }
    </style>
</head>
<body>
<aside class="sidebar">
    <div>
        <div class="logo"><div class="logo-icon">🔑</div><div><h1>Key Room</h1><p>ระบบจัดการกุญแจ</p></div></div>
        <div class="menu-title">เมนูหลัก</div>
        <nav class="menu">
            <a href="index.html"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="rooms.html"><span>🏫</span><span>กุญแจ/ห้องเรียน</span></a>
            <a href="borrow.html"><span>🔑</span><span>ยืมกุญแจ</span></a>
            <a href="return.html"><span>↩️</span><span>คืนกุญแจ</span></a>
            <a href="history.html" class="active"><span>📋</span><span>ประวัติ</span></a>
        </nav>
    </div>
</aside>
<main class="main">
    <header class="header">
        <div><div style="font-size: 11px; color: #94a3b8;">หน้าหลัก / ประวัติ</div><h2>บันทึกการยืม-คืน (Borrow Logs)</h2></div>
    </header>
    <section class="content">
        <div class="card-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h3>ประวัติทั้งหมด</h3>
                <button onclick="clearData()" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer;">ล้างข้อมูลประวัติ</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>รหัสทำรายการ</th>
                        <th>รหัสกุญแจ</th>
                        <th>ผู้ยืม (ID / ชื่อ)</th>
                        <th>วันเวลาที่ยืม</th>
                        <th>วันเวลาที่คืน</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </section>
</main>
<script>
function renderLogs() {
    const history = JSON.parse(localStorage.getItem("borrowLogs")) || [];
    const tbody = document.getElementById("historyBody");
    tbody.innerHTML = "";
    
    if (history.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding: 20px;">ไม่มีประวัติการยืม-คืน</td></tr>';
        return;
    }

    history.slice().reverse().forEach(item => {
        const tr = document.createElement("tr");
        const isBorrowing = item.status === "ยืมอยู่";
        tr.innerHTML = `
            <td><b>${item.logId || '-'}</b></td>
            <td>${item.keyId}</td>
            <td>${item.borrowerName} (${item.borrowerId || '-'})</td>
            <td>${item.borrowTime}</td>
            <td>${item.returnTime || '-'}</td>
            <td><span class="badge ${isBorrowing ? 'badge-borrowing':'badge-returned'}">${item.status}</span></td>
        `;
        tbody.appendChild(tr);
    });
}

function clearData() {
    if(confirm("ต้องการล้างประวัติยืม-คืนทั้งหมดหรือไม่?")) {
        localStorage.removeItem("borrowLogs");
        renderLogs();
    }
}

renderLogs();
</script>
</body>
</html>
