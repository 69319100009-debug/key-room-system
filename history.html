<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการยืม-คืน | Key Room System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="breadcrumb">หน้าหลัก / ประวัติ</div>
    <h1 class="page-title">บันทึกการยืม-คืน (Borrow Logs)</h1>

    <div class="card">
      <div class="btn-wrapper">
        <button class="btn-clear" onclick="clearHistory()">ล้างข้อมูลประวัติ</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ผู้ยืม (ID / ชื่อ)</th>
              <th>วันเวลาที่ยืม</th>
              <th>วันเวลาที่คืน</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="historyList">
            <!-- ข้อมูลจะขึ้นตรงนี้อัตโนมัติ -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- รวม JS ไว้ในนี้ ไม่ต้องสร้างไฟล์สคริปต์แยก -->
  <script>
    function renderHistory() {
      const historyList = document.getElementById('historyList');
      
      // ดึงข้อมูลจาก LocalStorage ถ้าไม่มีจะใช้ข้อมูลตัวอย่างมาแสดงทันที
      let logs = JSON.parse(localStorage.getItem('borrowLogs')) || [
        {
          name: 'ณัฐชนก พุ่มอุทสาห์',
          id: '69319100009',
          borrowTime: '24/8/2569 23:37',
          returnTime: '24/8/2569 23:38',
          status: 'คืนแล้ว'
        }
      ];

      if (logs.length === 0) {
        historyList.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px; color: #888;">ไม่มีข้อมูลประวัติ</td></tr>`;
        return;
      }

      historyList.innerHTML = logs.map(item => `
        <tr>
          <td>
            <div style="font-weight: bold; color: #1e293b;">${item.name}</div>
            <div style="font-size: 12px; color: #64748b;">(${item.id})</div>
          </td>
          <td>${item.borrowTime}</td>
          <td>${item.returnTime || '-'}</td>
          <td>
            <span class="status-badge">${item.status}</span>
          </td>
        </tr>
      `).join('');
    }

    function clearHistory() {
      if (confirm('คุณต้องการล้างข้อมูลประวัติทั้งหมดใช่หรือไม่?')) {
        localStorage.removeItem('borrowLogs');
        renderHistory();
      }
    }

    // ทำงานทันทีเมื่อโหลดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', renderHistory);
  </script>
</body>
</html>
